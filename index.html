<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Pandemonium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Mise en page : en-tête + onglets, puis un panneau par section ; une couleur d'accent par maison. */
:root{color-scheme:dark;--bg1:#0b0720;--bg2:#1a0f3d;--card:rgba(32,22,74,.72);--line:rgba(160,140,255,.28);--txt:#e9e4ff;--mut:#a79fd6;--gold:#e8d49a;--vio:#8b5cf6;--blue:#4f8cff;--ok:#6ee7b7;--bad:#fb7185;
--disp:"Cinzel Decorative",Cinzel,Georgia,serif;--body:"EB Garamond",Georgia,"Times New Roman",serif}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--txt);background:var(--bg1);background-image:radial-gradient(ellipse at 20% 0%,#3a1d8a55,transparent 55%),radial-gradient(ellipse at 90% 30%,#1d4ed855,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;font-family:var(--body);font-size:18px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:26px 16px 70px}
[hidden]{display:none!important}
.orn{text-align:center;color:var(--gold);letter-spacing:.6em;margin:0 0 4px;font-size:15px}
h1{font-family:var(--disp);font-weight:700;text-align:center;font-size:clamp(30px,7vw,52px);margin:4px 0 2px;letter-spacing:.08em;text-wrap:balance;background:linear-gradient(90deg,#c4b5fd,#93c5fd,#e8d49a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-style:italic;margin:0 0 14px}
.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;min-height:30px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:15px;color:var(--mut);background:#0e0a2877;white-space:nowrap}
.chip.live{border-color:var(--c,var(--gold));color:var(--txt);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.live b{color:var(--c,var(--gold));font-family:var(--disp);font-size:13px;margin-right:6px}
.chip.live.over{animation:pulse 1s infinite}
.chip.role{border-color:var(--gold);color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 14px var(--bad);border-color:var(--bad)}}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
button{font:inherit;font-family:var(--disp);font-size:12px;letter-spacing:.04em;color:var(--txt);cursor:pointer;border:1px solid var(--line);background:linear-gradient(135deg,#5b34c8,#2f5fd8);border-radius:8px;padding:9px 16px;min-height:38px}
button:hover:not(:disabled){filter:brightness(1.18)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.ghost,.tab{background:transparent}
.tab.on{background:linear-gradient(135deg,#5b34c8,#2f5fd8);border-color:var(--gold);color:var(--gold)}
button.go{background:linear-gradient(135deg,#0f766e,#2563eb)}
button.neg{background:linear-gradient(135deg,#9f1239,#6d28d9)}
button.gold{background:linear-gradient(135deg,#a8741a,#6d28d9);border-color:var(--gold);color:#fff3cc}
button.sm{padding:5px 11px;min-height:30px;font-size:11px}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--txt);background:#0e0a2899;border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0}
input[type=number]{width:96px}
select option{background:#1a0f3d}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;backdrop-filter:blur(6px);box-shadow:0 0 30px #6d28d933}
.sec{font-family:var(--disp);font-size:18px;margin:0 0 10px;color:var(--gold);font-weight:400;letter-spacing:.04em}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sec-row .sec{margin:0}
.hint,.meta{color:var(--mut);font-style:italic;font-size:16px;margin:0 0 10px}
.empty{text-align:center;color:var(--mut);font-style:italic;padding:22px 8px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pos{color:var(--ok)}.neg-t{color:var(--bad)}
/* sélecteur d'équipes */
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pk-h{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:12px;padding:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,transparent),transparent)}
.pk-t{font-family:var(--disp);font-size:13px;color:var(--c);margin-bottom:6px;letter-spacing:.05em}
.pk{display:flex;align-items:center;gap:8px;width:100%;margin-top:5px;text-align:left;background:#0e0a2899;font-size:12px}
.pk small{margin-left:auto;color:var(--mut);font-family:var(--body);font-size:14px}
.pk.on{border-color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 20%,#0e0a28)}
.pk-h{--dotc:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:#4b4380;flex:none}
.pk.assigned .dot{background:var(--blue)}
.pk.running .dot{background:var(--bad);animation:pulse2 1s infinite}
.pk.done .dot{background:var(--ok)}
@keyframes pulse2{50%{box-shadow:0 0 8px var(--bad)}}
/* numéros */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.num{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;aspect-ratio:1;padding:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#33237a,#120b34);border:2px solid var(--c,var(--line));color:var(--txt);transition:transform .2s,box-shadow .2s}
.num b{font-family:var(--disp);font-size:22px;line-height:1.1}
.num small{font-family:var(--body);font-size:11px;color:var(--mut);line-height:1.1;text-align:center}
.num.taken{box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.num.taken small{color:var(--c)}
.num.mine{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#33237a),#120b34);box-shadow:0 0 22px var(--c)}
.num.hl{transform:scale(1.14);border-color:var(--gold);box-shadow:0 0 26px var(--gold)}
.num:disabled{opacity:1;cursor:default}
.num:hover:not(:disabled){transform:translateY(-3px);filter:none}
/* arène */
.arena-h{display:flex;align-items:center;gap:14px;border-left:3px solid var(--c);padding-left:12px;margin-bottom:14px}
.arena-h .sg{font-size:34px;color:var(--c);text-shadow:0 0 14px var(--c)}
.an{font-family:var(--disp);font-size:20px}
.arena-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
@media (max-width:640px){.arena-body{grid-template-columns:1fr}}
.bignum{font-family:var(--disp);font-size:78px;line-height:1;text-align:center;color:var(--c);text-shadow:0 0 24px var(--c);margin:0}
.bignum-l{text-align:center;color:var(--mut);font-style:italic}
.clock{position:relative;width:176px;height:176px;margin:6px auto}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:7}
.clock .ring-t{stroke:#2a1f66}
.clock .ring-p{stroke:var(--c,var(--blue));stroke-linecap:round;stroke-dasharray:339.29;stroke-dashoffset:0;filter:drop-shadow(0 0 5px var(--c,var(--blue)))}
.clock .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:38px;font-variant-numeric:tabular-nums}
.clock .cl{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:var(--mut);font-size:14px;font-style:italic}
.clock.low .tm{color:var(--gold)}
.clock.over .tm{color:var(--bad);animation:pulse3 1s infinite}
@keyframes pulse3{50%{opacity:.45}}
.mons{display:grid;gap:10px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#1e1450cc,#0e0a28cc);display:flex;justify-content:space-between;gap:10px;align-items:center;animation:rev .7s both}
.mcard .mn{font-family:var(--disp);font-size:16px}
.mcard .mp{color:var(--gold);font-family:var(--disp);white-space:nowrap}
.mcard.sealed{border-style:dashed;justify-content:center;color:var(--mut);font-style:italic;animation:none}
@keyframes rev{from{opacity:0;transform:rotateX(80deg) translateY(10px)}to{opacity:1;transform:none}}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}
/* points */
.score{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.score .big{font-family:var(--disp);font-size:54px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.score .bd{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#0e0a2877}
.mrow.fallen{border-color:var(--ok)}
.mrow.fallen .mn{text-decoration:line-through;color:var(--mut)}
.mrow .mn{font-family:var(--disp);font-size:14px}
.mrow .mp{color:var(--gold);font-family:var(--disp);font-size:14px;margin-left:8px}
.plr{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.plr input[type=text]{flex:1 1 140px}
.plr.deadp input[type=text]{text-decoration:line-through;color:var(--mut)}
.skull{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--mut);white-space:nowrap;cursor:pointer}
.skull input{width:20px;height:20px;accent-color:#e11d48}
.plr.deadp .skull{color:var(--bad)}
.log{list-style:none;margin:0;padding:0}
.log li{border-left:2px solid var(--vio);padding:4px 0 4px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.log .d{font-size:13px;color:var(--mut)}
.log .v{font-family:var(--disp);font-size:15px;white-space:nowrap}
.tname{margin-top:10px}
.stage{position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 24%,transparent),transparent 62%),var(--card)}
.orb{position:relative;width:min(250px,72vw);aspect-ratio:1;margin:4px auto 10px;display:grid;place-items:center}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--c),transparent 28%,var(--c) 52%,transparent 78%,var(--c));-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%);animation:spin 9s linear infinite;filter:drop-shadow(0 0 10px var(--c))}
.orb.spin::before{animation-duration:.6s}
.orb-in{width:82%;height:82%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d2c96,#120b34);display:grid;place-items:center;box-shadow:inset 0 0 30px #000a,0 0 34px color-mix(in srgb,var(--c) 40%,transparent)}
.orbn{font-family:var(--disp);font-size:clamp(64px,18vw,100px);line-height:1;color:var(--c);text-shadow:0 0 24px var(--c);font-variant-numeric:tabular-nums}
.orb.idle .orbn{animation:pulse3 2.4s infinite}
.orb.spin .orbn{filter:blur(.8px)}
.orb.land .orb-in{animation:land .9s}
.shock{position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);opacity:0;pointer-events:none}
.orb.land .shock{animation:shock 1.1s ease-out}
@keyframes land{0%{transform:scale(1.28);box-shadow:0 0 90px var(--c)}100%{transform:scale(1)}}
@keyframes shock{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.3);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage-l{font-family:var(--disp);font-size:18px;color:var(--c);letter-spacing:.05em}
.stage-s{color:var(--mut);font-style:italic;margin:2px 0 12px}
.draw-btn{font-size:14px;padding:14px 34px;min-height:48px}
.mcard.back{justify-content:center;border-color:color-mix(in srgb,var(--c) 55%,transparent);background:repeating-linear-gradient(135deg,#1e1450,#1e1450 10px,#261b66 10px,#261b66 20px);font-family:var(--disp);font-size:28px;color:var(--gold);font-style:normal;animation:glow 2.6s infinite;text-shadow:0 0 12px var(--gold)}
@keyframes glow{50%{box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}}
.mcard.flip{animation:flipin .95s both}
@keyframes flipin{0%{transform:perspective(700px) rotateX(-95deg) scale(.9);opacity:0;box-shadow:0 0 50px var(--c)}55%{opacity:1}100%{transform:none;box-shadow:0 0 0 transparent}}
.arena-body.one{grid-template-columns:1fr}
.cat{display:inline-block;width:1em;height:1em;vertical-align:-.14em;fill:currentColor}
.roster{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0e0a2877}
.role-l{flex:0 0 108px;font-family:var(--disp);font-size:11px;color:var(--c);letter-spacing:.04em}
.role-l.sub{color:var(--mut)}
.roster .plr input[type=text]{flex:1 1 120px}
/* classement */
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.hcard{position:relative;border:1px solid var(--c);border-radius:14px;padding:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(14,10,40,.78));box-shadow:0 0 calc(4px*var(--g)) var(--c);overflow:hidden}
.hcard .rk{position:absolute;right:12px;top:6px;font-family:var(--disp);font-size:34px;color:color-mix(in srgb,var(--c) 70%,transparent)}
.hcard .sg{font-size:26px;color:var(--c)}
.hcard h3{font-family:var(--disp);font-size:20px;margin:0;color:var(--c)}
.hcard .tot{font-family:var(--disp);font-size:36px;color:var(--txt);font-variant-numeric:tabular-nums}
.hcard .tot small{font-size:13px;color:var(--mut);margin-left:4px}
.hcard .sub2{color:var(--mut);font-size:15px}
.hbar{height:8px;border-radius:99px;background:#0e0a28;border:1px solid var(--line);margin:8px 0;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-family:var(--disp);font-weight:400;font-size:12px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.05em;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #a08cff1f;font-variant-numeric:tabular-nums}
th.r,td.r{text-align:right}
tr.first td{background:#e8d49a14}
.pl{font-family:var(--disp);font-size:18px;color:var(--mut)}
tr.first .pl{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.tn{display:flex;align-items:center;gap:10px}
.tn .sg{color:var(--c);font-size:20px}
.tn .nm{font-family:var(--disp);font-size:14px}
.tn small{display:block;color:var(--mut);font-size:14px}
.tot-c{font-family:var(--disp);font-size:20px;color:var(--gold)}
.st{font-size:14px;color:var(--mut)}
.st.running{color:var(--bad)}.st.done{color:var(--ok)}
details.bes{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
details.bes summary{cursor:pointer;font-family:var(--disp);font-size:14px;color:var(--gold);padding:6px 0}
.bn{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#0e0a2877}
.bn h4{font-family:var(--disp);font-size:14px;margin:0 0 8px;color:var(--gold);font-weight:400}
.bm{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.bm input[type=text]{flex:1 1 160px}
/* connexion */
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,3,20,.72);display:grid;place-items:center;padding:16px}
.ov .box{width:min(440px,100%);background:#1a1146;border:1px solid var(--gold);border-radius:14px;padding:18px;box-shadow:0 0 40px #6d28d966}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1e1250;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:10px;transition:.3s;text-align:center;max-width:90vw;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}
.snd{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;padding:5px 11px;min-height:32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<button class="ghost snd" id="snd" aria-label="Activer ou couper le son" title="Son">♪ Son</button>
<div class="wrap">
  <p class="orn">✧ ✦ ❖ ✦ ✧</p>
  <h1>Le Pandemonium</h1>
  <p class="sub">Tournoi des quatre maisons de Rivenguard</p>
  <div class="status" id="status" aria-live="polite"></div>
  <nav class="tabs" aria-label="Pages">
    <button class="tab" data-p="equipes">Équipes</button>
    <button class="tab" data-p="tirage">Tirage &amp; combat</button>
    <button class="tab" data-p="points">Points</button>
    <button class="tab" data-p="classement">Classement</button>
    <button class="ghost" id="adm" type="button">Accès Ministère</button>
  </nav>
  <main id="app"></main>
</div>
<div class="ov" id="lg" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="lgt"><h2 class="sec" id="lgt">Accès du Ministère</h2><p class="hint">Réservé à la tenue du tournoi. Les visiteurs consultent en lecture seule.</p><div class="row"><input type="password" id="lgp" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe" style="flex:1 1 180px"><button class="go" id="lgok" type="button">Entrer</button><button class="ghost" id="lgx" type="button">Fermer</button></div><p class="hint" id="lgm" style="margin:10px 0 0" aria-live="polite"></p></div></div>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
var HOUSES=[
 {id:'felora',n:'Felora',c:'#5fe3a1',s:'<svg class="cat" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M3.5 2.5l4.6 3.6a9.5 9.5 0 0 1 7.8 0l4.6-3.6v9.2c0 5.2-3.7 9.8-8.5 9.8s-8.5-4.600-8.500-9.800zM8.200 11.500a1.300 1.800 0 1 0 2.600 0a1.300 1.800 0 1 0-2.600 0zM13.200 11.500a1.300 1.800 0 1 0 2.600 0a1.300 1.800 0 1 0-2.600 0zM10.800 15.200h2.400l-1.200 1.400z"/></svg>'},
 {id:'ferrox',n:'Ferrox',c:'#ff8a7a',s:'✺'},
 {id:'oragonn',n:'Oragonn',c:'#f5d78a',s:'❖'},
 {id:'azuralys',n:'Azuralys',c:'#5eb0ff',s:'✦'}];
var ROM=['I','II'], PEN=5, TEAMS=[];
HOUSES.forEach(function(h){[1,2].forEach(function(i){TEAMS.push({id:h.id+'-'+i,h:h,i:i});});});
function T(id){for(var i=0;i<TEAMS.length;i++)if(TEAMS[i].id===id)return TEAMS[i];return TEAMS[0];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var app=document.getElementById('app');

/* ---------- données (valeurs par défaut : placeholders) ---------- */
function defCfg(){
  var counts=[1,2,1,3,2,1,2,1], nums=[];
  for(var n=1;n<=30;n++){
    var ms=[];
    var cn=counts[(n-1)%counts.length];
    for(var j=0;j<cn;j++) ms.push({k:'n'+n+'m'+(j+1),name:'Monstre mystère '+n+(cn>1?String.fromCharCode(65+j):''),pts:10*(j+1)});
    nums.push({n:n,mons:ms});
  }
  return {numbers:nums,teams:{},minutes:5};
}
var cfg=defCfg(), st={dead:{},fights:{}}, log=[];
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x);}
function deepMerge(a,b){
  var o={},k;
  for(k in a)o[k]=a[k];
  for(k in b){o[k]=(isObj(a[k])&&isObj(b[k]))?deepMerge(a[k],b[k]):b[k];}
  return o;
}
function normCfg(d){
  var base=defCfg();
  d=d||{};
  return {numbers:Array.isArray(d.numbers)&&d.numbers.length?d.numbers:base.numbers,teams:isObj(d.teams)?d.teams:{},minutes:+d.minutes>0?+d.minutes:5};
}

function nowS(){return Date.now()+skew;}
function apply(d){
  if(typeof d.now==='number')skew=d.now-Date.now();
  if(d.same)return;
  if(typeof d.rev==='number'&&d.rev<rev)return;
  rev=d.rev;cfg=normCfg(d.config);st=normSt(d.state);

}
function poll(){

  fetch('/api/data'+(rev>=0?'?rev='+rev:''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    apply(d);

}
function op(body){
  return fetch('/api/op',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':KEY},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      if(x.s===200)apply(x.j);
      else if(x.s===401){logout(true);toast('Session expirée : reconnectez-vous.');}
      else toast('Enregistrement impossible, réessayez.');
    }).catch(function(){toast('Serveur injoignable, réessayez.');});
}

function actx(){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}
}
function tone(f,t0,d,v,type){
  var c=actx();if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);
}
function sfx(k,x){
  if(muted)return;
  try{
    if(k==='tick')tone(380+(x||0)*620,0,0.09,0.05,'triangle');
    if(k==='draw'){[392,494,587,784,988].forEach(function(f,i){tone(f,i*0.09,1.1,0.07,'sine');});tone(98,0,1.6,0.12,'sine');}
    if(k==='rev'){[262,330,392,523].forEach(function(f,i){tone(f,i*0.06,1.4,0.06,'triangle');});}
    if(k==='start'){tone(98,0,3.2,0.16,'sine');tone(196,0,2.4,0.07,'sine');tone(294,0,1.8,0.04,'sine');}
    if(k==='end'){tone(82,0,4,0.2,'sine');tone(164,0,3,0.09,'sine');tone(246,0,2.2,0.05,'sine');tone(82,0.9,3.4,0.16,'sine');}
    if(k==='kill'){tone(659,0,0.7,0.08,'sine');tone(988,0.1,0.9,0.07,'sine');}
    if(k==='dead'){tone(330,0,0.5,0.08,'triangle');tone(220,0.18,0.7,0.08,'triangle');tone(147,0.4,1,0.08,'triangle');}
    if(k==='click')tone(700,0,0.06,0.04,'sine');
  }catch(e){}
}

  }
  var mine=log.filter(function(e){return e.team===sel;});
  h+='<section class="panel"><h2 class="sec">Journal</h2>';
  if(!mine.length&&!c.dead)h+='<p class="empty">Aucun point enregistré pour cette équipe.</p>';
  else{
    h+='<ul class="log">';
    if(c.dead)h+='<li><div><div>'+c.dead+' joueur'+(c.dead>1?'s':'')+' mort'+(c.dead>1?'s':'')+'</div><div class="d">Pénalité automatique</div></div><span class="v neg-t">−'+c.pen+'</span></li>';
    mine.forEach(function(e){
      h+='<li><div><div>'+esc(e.kind==='kill'?'Monstre tombé : '+e.label:e.label)+'</div><div class="d">'+fmtD(e.ts)+'</div></div><span class="v '+((+e.pts||0)<0?'neg-t':'pos')+'">'+sgn(+e.pts||0)+'</span>'+(isAdmin?'<button class="ghost sm" data-act="unkill" data-id="'+esc(e.id)+'" aria-label="Supprimer cette ligne">✕</button>':'')+'</li>';
    });
    h+='</ul>';
  }
  h+='</section>';
  return h;
}

/* --- page Classement --- */
function ranking(){
  var rows=TEAMS.map(function(t){var c=calc(t.id);c.t=t;c.f=fight(t.id);return c;});
  rows.sort(function(a,b){return b.total-a.total||a.dead-b.dead||(a.t.id<b.t.id?-1:1);});
  var r=0,prev=null;
  rows.forEach(function(x,i){var key=x.total+'|'+x.dead;if(key!==prev){r=i+1;prev=key;}x.rank=r;});
  var hs=HOUSES.map(function(h){
    var ts=rows.filter(function(x){return x.t.h===h;});
    return {h:h,total:ts.reduce(function(s,x){return s+x.total;},0),dead:ts.reduce(function(s,x){return s+x.dead;},0),ts:ts};
  });
  hs.sort(function(a,b){return b.total-a.total||a.dead-b.dead||(a.h.id<b.h.id?-1:1);});
  r=0;prev=null;
  hs.forEach(function(x,i){var key=x.total+'|'+x.dead;if(key!==prev){r=i+1;prev=key;}x.rank=r;});
  return {rows:rows,hs:hs};
}
function pageClassement(){
  var R=ranking(), max=Math.max(1,R.hs.reduce(function(m,x){return Math.max(m,x.total);},0));
  var h='<section><div class="sec-row"><h2 class="sec">Classement des maisons</h2><span class="meta" style="margin:0">Total des deux équipes, mis à jour en direct</span></div><div class="houses">';
  R.hs.forEach(function(x){
    h+='<div class="hcard" style="--c:'+x.h.c+';--g:'+(5-x.rank)*2+'"><div class="rk">'+x.rank+'</div><div class="sg">'+x.h.s+'</div><h3>'+esc(x.h.n)+'</h3><div class="tot">'+x.total+'<small>pts</small></div><div class="hbar"><i style="width:'+Math.max(0,Math.round(100*x.total/max))+'%"></i></div>';
    x.ts.forEach(function(y){h+='<div class="sub2">'+esc(tname(y.t))+' : '+y.total+' pts</div>';});
    h+='</div>';
  });
  h+='</div></section><section class="panel"><h2 class="sec">Classement des équipes</h2><div class="tw"><table><thead><tr><th>Rang</th><th>Équipe</th><th class="r">Monstres</th><th class="r">Ajust.</th><th class="r">Morts</th><th class="r">Pénalités</th><th class="r">Total</th></tr></thead><tbody>';
  R.rows.forEach(function(x){
    var stt=x.f.status==='running'?'<small class="st running">En combat</small>':x.f.status==='done'?'<small class="st done">Combat terminé</small>':x.f.n?'<small class="st">Numéro '+x.f.n+'</small>':'<small class="st">En attente</small>';
    h+='<tr class="'+(x.rank===1&&x.total>0?'first':'')+'"><td class="pl">'+x.rank+'</td><td><div class="tn" style="--c:'+x.t.h.c+'"><span class="sg">'+x.t.h.s+'</span><div><span class="nm">'+esc(x.t.h.n)+' · '+esc(tname(x.t))+'</span>'+stt+'</div></div></td><td class="r">'+sgn(x.kills)+' <span class="st">('+x.nk+')</span></td><td class="r">'+(x.adj?sgn(x.adj):'0')+'</td><td class="r">'+x.dead+'</td><td class="r">'+(x.pen?'−'+x.pen:'0')+'</td><td class="r tot-c">'+x.total+'</td></tr>';
  });
  h+='</tbody></table></div><p class="hint" style="margin:10px 0 0">À égalité de points, l’équipe qui compte le moins de morts passe devant.</p></section>';
  return h;
}

function typing(){var a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a);}
var rt=null;
function render(){clearTimeout(rt);rt=setTimeout(doRender,30);}
function doRender(){
  if(typing()){pending=true;return;}
  pending=false;
  head();
  app.innerHTML=page==='points'?pagePoints():page==='classement'?pageClassement():page==='equipes'?pageEquipes():pageTirage();
  tick();
}
document.addEventListener('focusout',function(){setTimeout(function(){if(pending&&!typing())doRender();},90);});
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.addEventListener('click',function(){sfx('click');go(b.getAttribute('data-p'));});});

/* ---------- actions ---------- */
function assign(n,tid){
  tid=tid||sel;
  var f=fight(tid);
  if(f.status==='running'){toast('Le combat de cette équipe est en cours.');return;}
  var o=takenMap()[n];
  if(o&&o!==tid){toast('Le numéro '+n+' est déjà pris par '+T(o).h.n+' '+ROM[T(o).i-1]+'.');return;}
  patch('pand/state',{fights:(function(){var x={};x[tid]={n:n,rev:false,status:'assigned',start:null,end:null};return x;})()});
}
function randInt(m){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%m;}catch(e){return Math.floor(Math.random()*m);}}
function randomDraw(){
  var tid=sel, f=fight(tid);
  if(drawing)return;
  if(f.status==='running'){toast('Le combat de cette équipe est en cours.');return;}
  var taken=takenMap(), free=cfg.numbers.map(function(x){return x.n;}).filter(function(n){return !taken[n];});
  if(!free.length){toast('Plus aucun numéro libre.');return;}
  var pick=free[randInt(free.length)], i=0, steps=28, col=T(tid).h.c;
  drawing=true;stageNum=free[randInt(free.length)];render();
  function step(){
    var last=i>=steps, n=last?pick:free[randInt(free.length)];
    if(!last&&free.length>1)while(n===stageNum)n=free[randInt(free.length)];
    stageNum=n;hl=n;
    var el=document.getElementById('orbn');if(el)el.textContent=n;
    paintHl();
    if(!last){sfx('tick',i/steps);i++;setTimeout(step,50+240*Math.pow(i/steps,3));}
    else{
      var orb=document.getElementById('orb');
      if(orb){orb.classList.remove('spin');orb.classList.add('land');}
      sfx('draw');burst(col);
      setTimeout(function(){drawing=false;hl=null;stageNum=null;assign(pick,tid);},1300);
    }
  }
  setTimeout(step,120);
}
function burst(col){
  var cv=document.getElementById('burst');if(!cv)return;
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  var cx=cv.getContext('2d'),ob=document.getElementById('orb').getBoundingClientRect();
  var ox=(ob.left+ob.width/2-r.left)*dpr, oy=(ob.top+ob.height/2-r.top)*dpr, ps=[],i;
  for(i=0;i<90;i++){var a=Math.random()*6.283,v=(2+Math.random()*7)*dpr;ps.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:(1+Math.random()*2.6)*dpr,c:i%3===0?'#e8d49a':col});}
  var t0=performance.now();
  (function f(now){
    var c2=document.getElementById('burst');if(c2!==cv)return;
    var k=(now-t0)/1400;cx.clearRect(0,0,cv.width,cv.height);
    if(k>=1)return;
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.12*dpr;cx.globalAlpha=1-k;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10*dpr;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();});
    requestAnimationFrame(f);
  })(t0);
}
function paintHl(){Array.prototype.forEach.call(document.querySelectorAll('.num'),function(b){b.classList.toggle('hl',+b.getAttribute('data-n')===hl);});}
function setFight(part){var x={};x[sel]=part;patch('pand/state',{fights:x});}
function saveNumbers(nums){patch('pand/config',{numbers:nums});}
function cloneNums(){return JSON.parse(JSON.stringify(cfg.numbers));}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act');
  if(a==='pick'){sel=b.getAttribute('data-t');armed=null;render();return;}
  if(a==='goteam'){sel=b.getAttribute('data-t');go('tirage');return;}
  if(!isAdmin&&a!=='gopoints')return;
  if(a==='num'){sfx('click');assign(+b.getAttribute('data-n'));}
  else if(a==='draw')randomDraw();
  else if(a==='reveal'){sfx('rev');setFight({rev:true});}
  else if(a==='launch'){var s=nowS();sfx('start');setFight({status:'running',rev:true,start:s,end:s+cfg.minutes*60000});}
  else if(a==='finish'){setFight({status:'done'});}
  else if(a==='gopoints')go('points');
  else if(a==='reset'){
    if(armed===sel){armed=null;setFight({n:null,rev:false,status:'idle',start:null,end:null});toast('Équipe réinitialisée.');}
    else{armed=sel;render();setTimeout(function(){if(armed===sel){armed=null;render();}},4000);}
  }
  else if(a==='kill'){
    var f=fight(sel),nd=numData(f.n),k=b.getAttribute('data-k'),m=nd&&nd.mons.filter(function(x){return x.k===k;})[0];
    if(!m)return;
    if(log.some(function(x){return x.team===sel&&x.kind==='kill'&&x.key===k;}))return;
    sfx('kill');addLog({team:sel,kind:'kill',key:k,label:m.name,pts:+m.pts||0});
  }
  else if(a==='unkill')delLog(b.getAttribute('data-id'));
  else if(a==='adj'){
    var v=Math.abs(parseInt(document.getElementById('adjv').value,10)||0), c=document.getElementById('adjc').value.trim();
    if(!v){toast('Indiquez un nombre de points.');return;}
    if(!c){toast('Ajoutez un commentaire.');return;}
    var sg=+b.getAttribute('data-s');
    addLog({team:sel,kind:'adj',label:c,pts:sg*v});sfx(sg>0?'kill':'dead');
    document.getElementById('adjc').value='';
  }
  else if(a==='addmon'){var n=cloneNums(),i=+b.getAttribute('data-ni');n[i].mons.push({k:'m'+Date.now().toString(36),name:'Nouveau monstre',pts:10});saveNumbers(n);}
  else if(a==='delmon'){var n2=cloneNums();n2[+b.getAttribute('data-ni')].mons.splice(+b.getAttribute('data-mi'),1);saveNumbers(n2);}
  else if(a==='addnum'){var n3=cloneNums(),nn=n3.reduce(function(m,x){return Math.max(m,x.n);},0)+1;n3.push({n:nn,mons:[{k:'n'+nn+'m1',name:'Monstre mystère '+nn,pts:10}]});saveNumbers(n3);}
  else if(a==='delnum'){
    var n4=cloneNums();if(n4.length<=1)return;
    var last=n4[n4.length-1].n;
    if(takenMap()[last]){toast('Le numéro '+last+' est attribué à une équipe.');return;}
    n4.pop();saveNumbers(n4);
  }
});
app.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('chip')&&e.target.getAttribute('data-act')){e.preventDefault();e.target.click();}});
document.getElementById('status').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b){sel=b.getAttribute('data-t');go('tirage');}});
document.getElementById('status').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('data-act')){e.preventDefault();e.target.click();}});
app.addEventListener('change',function(e){
  var el=e.target,f=el.getAttribute('data-f');if(!f||!isAdmin)return;
  if(f==='pname'||f==='rname'){
    var tid=f==='rname'?el.getAttribute('data-t'):sel;
    var pl=players(T(tid)).slice();while(pl.length<6)pl.push('');pl[+el.getAttribute('data-i')]=el.value.trim();
    var o={};o[tid]={players:pl};patch('pand/config',{teams:o});
  }else if(f==='rtname'){
    var o4={};o4[el.getAttribute('data-t')]={name:el.value.trim()};patch('pand/config',{teams:o4});
  }else if(f==='tname'){
    var o2={};o2[sel]={name:el.value.trim()};patch('pand/config',{teams:o2});
  }else if(f==='pdead'){
    var d={};d[el.getAttribute('data-i')]=el.checked;var o3={};o3[sel]=d;
    sfx(el.checked?'dead':'click');patch('pand/state',{dead:o3});
  }else if(f==='mname'||f==='mpts'){
    var n=cloneNums(),m=n[+el.getAttribute('data-ni')].mons[+el.getAttribute('data-mi')];
    if(f==='mname')m.name=el.value.trim()||'Monstre mystère';else m.pts=parseInt(el.value,10)||0;
    saveNumbers(n);
  }else if(f==='minutes'){
    patch('pand/config',{minutes:Math.max(1,Math.min(60,parseInt(el.value,10)||5))});
  }
});

/* ---------- minuteur ---------- */
function fmt(ms){var s=Math.ceil(Math.max(0,ms)/1000);return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);}
function tick(){
  var now=nowS();
  Array.prototype.forEach.call(document.querySelectorAll('[data-end]'),function(el){
    var end=+el.getAttribute('data-end'),tot=+el.getAttribute('data-tot')||300000,left=end-now;
    var tm=el.querySelector('.tm');if(tm)tm.textContent=fmt(left);
    el.classList.toggle('over',left<=0);el.classList.toggle('low',left>0&&left<=30000);
    var ring=el.querySelector('.ring-p');if(ring)ring.style.strokeDashoffset=(339.29*(1-Math.max(0,Math.min(1,left/tot)))).toFixed(1);
  });
  TEAMS.forEach(function(t){
    var f=fight(t.id);
    if(f.status==='running'&&f.end&&now>=f.end){
      var key=t.id+'@'+f.start;
      if(!gonged[key]){gonged[key]=1;if(now-f.end<8000)sfx('end');}
    }
  });
}
setInterval(tick,250);

/* ---------- fond animé ---------- */
(function(){
  var cv=document.getElementById('bg'),cx=cv.getContext('2d'),W,H,ps=[];
  var cols=['#a78bfa','#60a5fa','#e8d49a','#c084fc'];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  size();addEventListener('resize',size);
  for(var i=0;i<70;i++)ps.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*.00012+.00003,p:Math.random()*6.3,c:cols[i%4]});
  var still=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t){
    cx.clearRect(0,0,W,H);
    ps.forEach(function(p){
      if(!still){p.y-=p.v*16;if(p.y<-0.02){p.y=1.02;p.x=Math.random();}}
      var a=.25+.45*Math.abs(Math.sin(t/1400+p.p));
      cx.globalAlpha=a;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=8;
      cx.beginPath();cx.arc(p.x*W+Math.sin(t/3000+p.p)*14,p.y*H,p.r,0,6.3);cx.fill();
    });
    if(!still)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

render();
boot();
})();
</script>
